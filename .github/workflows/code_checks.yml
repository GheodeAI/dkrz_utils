name: Code Quality Checks

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

jobs:
  code_checks:
    name: Run Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    # Python checks
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'
        
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pylint mypy black
        
    - name: Check Python syntax with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=15 --max-line-length=300 --statistics
        
    - name: Check Python types with mypy
      run: |
        mypy --install-types --non-interactive --ignore-missing-imports .
        
    - name: Check Python formatting with Black
      run: |
        black --check --diff .
        
    # Bash checks
    - name: Install ShellCheck
      run: sudo apt-get install shellcheck
      
    - name: Check Bash scripts with ShellCheck
      run: |
        find . -type f -name '*.sh' -exec shellcheck {} +
        
    # Spelling checks
    - name: Install aspell for spell checking
      run: sudo apt-get install aspell aspell-en
      
    - name: Check spelling in code comments and docs
      run: |
        # This checks all .py, .md, .rst, .txt files
        find . -type f \( -name '*.py' -o -name '*.md' -o -name '*.rst' -o -name '*.txt' \) \
          -exec aspell --lang=en --mode=ccpp list {} \; | sort -u > misspelled.txt
        if [ -s misspelled.txt ]; then
          echo "Found potentially misspelled words:"
          cat misspelled.txt
          exit 1
        fi
